{% if page.has_other_pages %}
<nav class="pagination">
  {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">← Précédent</a>{% endif %}
  <span>Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">Suivant →</a>{% endif %}
</nav>
{% endif %}
