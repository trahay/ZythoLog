{% if field %}
<div class="field{% if field.errors %} has-error{% endif %} field-{{ field.name }}">
  <label{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}
</div>
{% endif %}
